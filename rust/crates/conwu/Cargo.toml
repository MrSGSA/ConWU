[package]
name = "conwu"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
lab-api = []
local-install = []
production = []

[dependencies]
conwu-core = { path = "../conwu-core" }
anyhow.workspace = true
base64.workspace = true
hex.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
uuid.workspace = true
zeroize.workspace = true
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.28"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
x509-parser = "0.18"
include_dir = "0.7"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
socket2 = { version = "0.6", features = ["all"] }
url = "2"
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
libloading = "0.8"
ring = "0.17"
rustls-pemfile = "2"
roxmltree = "0.21"
tar = "0.4"
flate2 = "1"
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
jpeg-encoder = "0.6"
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_NetworkManagement_WindowsFirewall", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_Shell_Common"] }
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Services", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
