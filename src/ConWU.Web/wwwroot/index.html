<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>创建网络 · ConWU</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/experience.css">
<link rel="stylesheet" href="/projection.css">
</head>
<body>
<svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<symbol id="i-logo" viewBox="0 0 256 256"><rect width="256" height="256" rx="56" fill="#1a1b26"/><g transform="rotate(45 128 128)" fill="none" stroke="#7aa2f7" stroke-width="24" stroke-linecap="round"><path d="M96 76H76a52 52 0 0 0 0 104h20M160 76h20a52 52 0 0 1 0 104h-20M88 128h80"/></g></symbol>
<symbol id="i-overview" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
<symbol id="i-create" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4M12 8v5M9.5 10.5h5"/></symbol>
<symbol id="i-join" viewBox="0 0 24 24"><path d="M13 4h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6M3 12h12m-4-4 4 4-4 4"/></symbol>
<symbol id="i-exit" viewBox="0 0 24 24"><path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5m5-13 5 5-5 5M8 12h12"/></symbol>
<symbol id="i-log" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3m6 0h4"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
<symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M16 6.5h2M16 17.5h2"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24"><path d="m10 13 4-4M9 16l-2 2a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 1 2-2a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0" transform="translate(1 0)"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="M4 5v6h6M5 10a8 8 0 1 1 1 9"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6l-8-3Z"/><path d="m8 12 3 3 5-6"/></symbol>
<symbol id="i-laptop" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="12" rx="2"/><path d="M2 20h20l-2-4H4l-2 4Z"/></symbol>
<symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="13" rx="2"/><path d="M8 21h8M12 16v5"/></symbol>
<symbol id="i-port" viewBox="0 0 24 24"><path d="M8 3v5m8-5v5M5 8h14v4a7 7 0 0 1-14 0V8Zm7 11v3"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></symbol>
<symbol id="i-save" viewBox="0 0 24 24"><path d="M4 3h13l4 4v14H3V3h1Zm3 0v6h9V3M7 21v-8h10v8"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 13.5A9 9 0 0 1 10.5 3a9 9 0 1 0 10 10.5Z"/></symbol>
</svg>
<a class="skip-link" href="#content">跳到主要内容</a>
<aside class="sidebar">
 <button class="brand mode-switch" id="mode-switch" type="button" aria-label="ConWU" disabled>
  <span class="brand-mark" aria-hidden="true"><svg class="logo brand-network-mark"><use href="#i-logo"/></svg><span class="projection-mark brand-projection-mark"><span class="projection-lens"></span><span class="projection-beam"></span><span class="projection-screen"></span></span></span>
  <span class="brand-copy" aria-hidden="true"><span class="brand-network-name">ConWU</span><span class="brand-projection-name">Projection</span></span>
  <svg class="icon brand-switch-arrow" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 8h15m-4-4 4 4-4 4M20 16H5m4-4-4 4 4 4"/></svg>
 </button>
 <nav class="nav-list" aria-label="主要导航">
  <button class="nav" data-page="overview" title="概况"><svg class="icon"><use href="#i-overview"/></svg><span class="nav-text">概况</span></button>
  <button class="nav active" data-page="create" title="创建网络"><svg class="icon"><use href="#i-create"/></svg><span class="nav-text">创建网络</span></button>
  <button class="nav" data-page="join" title="加入网络"><svg class="icon"><use href="#i-join"/></svg><span class="nav-text">加入网络</span><span class="count-dot" id="request-dot" hidden></span></button>
  <button class="nav exit" data-page="exit" title="退出网络"><svg class="icon"><use href="#i-exit"/></svg><span class="nav-text">退出网络</span></button>
  <button class="nav" data-page="requests" title="加入申请"><svg class="icon"><use href="#i-shield"/></svg><span class="nav-text">加入申请</span><span class="nav-count" id="requests-count" hidden></span></button>
  <button class="nav" data-page="coordination" title="对外协调"><svg class="icon"><use href="#i-server"/></svg><span class="nav-text">对外协调</span></button>
  <button class="nav" data-page="uu" title="UU远程"><svg class="icon"><use href="#i-link"/></svg><span class="nav-text">UU远程</span></button>
  <div class="nav-separator" role="separator"></div>
  <button class="nav" data-page="logs" title="日志"><svg class="icon"><use href="#i-log"/></svg><span class="nav-text">日志</span></button>
  <button class="nav" data-page="settings" title="设置"><svg class="icon"><use href="#i-settings"/></svg><span class="nav-text">设置</span><span id="settings-dirty-dot" class="count-dot" hidden></span></button>
 </nav>
 <nav class="projection-rail" id="projection-device-list" aria-label="已配对设备"></nav>
 <div class="sidebar-bottom"><div class="sidebar-tools"><div class="backend"><span class="dot" id="backend-dot"></span><span id="backend-state" class="small muted" role="status">正在读取后台</span></div><button class="btn icon-only" data-action="theme" id="theme-button" aria-label="切换浅色外观" title="切换界面外观"><svg class="icon"><use href="#i-sun"/></svg></button></div><div class="sidebar-device"><div class="avatar" id="sidebar-initials">AK</div><div class="grow"><div class="small" id="sidebar-name">正在读取</div><div class="small dim">本机设备</div></div></div></div>
</aside>
<div class="workspace">
 <div id="notice" class="live-notice" role="status" hidden></div><main class="content" id="content" tabindex="-1"></main>
 <footer class="footer"><span>ConWU · 让设备连起来</span><span><span id="app-version"></span></span></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog class="small-dialog invitation-dialog" id="invitation-dialog" aria-labelledby="invitation-title">
 <div class="modal-header"><h2 id="invitation-title"></h2><button class="btn icon-only" data-ui-action="close-invitation" aria-label="关闭直连码"><svg class="icon"><use href="#i-x"/></svg></button></div>
 <div class="pad"><div class="code-label-row"><h3>本机直连码</h3><span class="hint" id="invitation-code-length"></span></div><div class="code-control direct-code-control direct-code-readonly" id="invitation-code" role="group" aria-label="尚未生成直连码"></div><label class="field" id="invitation-family-field" hidden><span>直连码入口类型</span><select id="invitation-family" aria-describedby="invitation-family-hint" hidden><option value="">自动：优先 IPv4 · 16 位</option><option value="ipv4">IPv4 · 16 位</option><option value="ipv6">IPv6 · 36 位</option></select></label><p class="hint" id="invitation-family-hint"></p><p id="invitation-status" role="status"></p><div class="error" id="invitation-error" role="status"></div><div class="code-actions"><button class="btn primary" id="invitation-generate" data-ui-action="generate">生成直连码</button><button class="btn compact" data-ui-action="copy-pair"><svg class="icon"><use href="#i-copy"/></svg>复制</button></div></div>
</dialog>
<dialog id="confirm-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description"><h2 id="dialog-title"></h2><p id="dialog-description"></p><div class="row"><button class="btn" id="dialog-cancel">取消</button><button class="btn danger" id="dialog-confirm">确认</button></div></dialog>
<script src="/app.js" defer></script>
<script src="/workspace.js" defer></script>
<script src="/uu-takeover.js" defer></script>
<script src="/projection.js" defer></script>
<script src="/projection-files.js" defer></script>
<script src="/experience.js" defer></script>
<dialog class="network-dialog" id="network-dialog" aria-labelledby="network-dialog-title"><div class="modal-header"><div><h2 id="network-dialog-title">网络设置</h2><p id="network-dialog-subtitle"></p></div><button class="btn icon-only" data-ui-action="close-editor" aria-label="关闭网络设置"><svg class="icon"><use href="#i-x"/></svg></button></div><div class="modal-grid"><nav class="modal-nav" id="network-settings-nav" aria-label="网络设置分区"></nav><div class="modal-body" id="network-settings-body"></div></div><div class="modal-footer"><span class="save-state" id="network-save-state" role="status"></span><div class="row" id="network-edit-actions"><button class="btn compact" data-ui-action="restore-editor">恢复默认设置</button><button class="btn primary compact" data-ui-action="save-editor">保存设置</button></div><button class="btn compact" id="network-readonly-close" data-ui-action="close-editor" hidden>关闭</button></div></dialog>
<dialog class="small-dialog projection-settings-dialog" id="projection-dialog" aria-labelledby="projection-title">
 <div class="pad projection-settings-body">
  <header><h2 id="projection-title">Projection 设置</h2><p class="muted" id="projection-network"></p></header>
  <fieldset>
   <legend>画面</legend>
   <label class="field"><span>分辨率</span><select id="projection-resolution"><option value="local">跟随本机</option><option value="peer">跟随对机</option><option value="custom">自定义</option></select></label>
   <div class="projection-settings-grid" id="projection-custom-size">
    <label class="field"><span>宽度（像素）</span><input id="projection-width" type="number" min="640" max="7680" step="2"></label>
    <label class="field"><span>高度（像素）</span><input id="projection-height" type="number" min="360" max="4320" step="2"></label>
   </div>
   <div class="projection-settings-grid">
    <label class="field"><span>帧率（FPS）</span><input id="projection-fps" type="number" min="15" max="240" step="1"></label>
    <label class="field"><span>码率</span><select id="projection-bitrate" aria-describedby="projection-bandwidth"><option value="low">低 · 保帧优先</option><option value="medium">中 · 自动估算</option><option value="high">高 · 画质优先</option></select><span id="projection-bandwidth" class="hint" role="status"></span></label>
   </div>
   <p class="hint">画面设置在下次串流开始时生效。</p>
  </fieldset>
  <fieldset>
   <legend>设备权限</legend>
   <label class="projection-check"><input id="projection-allowed" type="checkbox"><span>允许对机查看桌面预览并远程控制本机</span></label>
   <label class="projection-check"><input id="projection-files" type="checkbox"><span>允许对机浏览并互传文件</span></label>
   <label class="projection-check"><input id="projection-clipboard" type="checkbox"><span>串流时同步文本剪贴板</span></label>
   <label class="field" id="projection-legacy-port"><span>监听端口（TCP）</span><input id="projection-port" type="number" min="1024" max="65535" step="1"></label>
  </fieldset>
  <p id="projection-error" role="alert" class="danger-text"></p>
 </div>
 <div class="dialog-actions"><button class="btn" data-ui-action="close-projection-settings">取消</button><button class="btn primary" data-ui-action="save-projection-settings">保存设置</button></div>
</dialog>
<dialog id="projection-file-dialog" class="projection-file-dialog" aria-labelledby="projection-file-title">
 <header class="modal-header">
  <h2 id="projection-file-title">文件互传</h2>
  <div class="row">
   <button class="btn compact" type="button" id="projection-send-files" data-ui-action="projection-files">选文件发送</button>
   <button class="btn icon-only" type="button" id="projection-file-close" aria-label="关闭文件互传"><svg class="icon"><use href="#i-x"/></svg></button>
  </div>
 </header>
 <div class="projection-file-panes">
  <section id="projection-local-files" class="projection-file-pane" data-file-side="local" aria-label="本机目录"></section>
  <section id="projection-remote-files" class="projection-file-pane" data-file-side="remote" aria-label="对机目录"></section>
 </div>
 <footer class="projection-file-history">
  <div class="projection-file-queue-head"><h3>传输队列</h3>
   <button class="btn compact" type="button" id="projection-file-clear">清除已结束</button>
  </div>
  <div id="projection-file-tasks"></div>
  <p id="projection-file-error" class="danger-text" role="alert"></p>
 </footer>
</dialog>
<dialog class="small-dialog help-dialog" id="help-dialog" aria-labelledby="help-title"><div class="modal-header"><h2 id="help-title"></h2><button class="btn icon-only" data-ui-action="close-help" aria-label="关闭帮助"><svg class="icon"><use href="#i-x"/></svg></button></div><div class="pad" id="help-content"></div><div class="dialog-actions"><button class="btn primary" data-ui-action="close-help">知道了</button></div></dialog>
<dialog class="small-dialog coordinator-dialog" id="coordination-dialog" aria-labelledby="coordination-title">
 <div class="modal-header"><h2 id="coordination-title">本机协调设置</h2><button class="btn icon-only" data-ui-action="close-coordination-settings" aria-label="关闭本机协调设置"><svg class="icon"><use href="#i-x"/></svg></button></div>
 <div class="pad" id="coordination-settings-fields"></div>
 <div class="error pad" id="coordination-error" role="status"></div>
 <div class="modal-footer"><span class="save-state" id="coordination-save-state" role="status"></span><div class="row"><button class="btn compact" id="restore-coordination" data-ui-action="restore-coordination">恢复默认设置</button><button class="btn primary compact" id="save-coordination" data-ui-action="save-coordination">保存设置</button></div></div>
</dialog>
<dialog class="small-dialog update-source-dialog" id="update-source-dialog" aria-labelledby="update-source-title"><div class="modal-header"><h2 id="update-source-title">选择下载来源</h2><button class="btn icon-only" data-ui-action="close-update-source" aria-label="关闭下载来源"><svg class="icon"><use href="#i-x"/></svg></button></div><div class="update-source-grid" id="update-source-content"></div><p class="error pad" id="update-source-error" role="status"></p></dialog>
</body>
</html>
