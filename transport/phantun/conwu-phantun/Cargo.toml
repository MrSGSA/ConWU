[package]
name = "conwu-phantun"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "ConWU owned native Phantun carrier"

[dependencies]
fake-tcp = { path = "../fake-tcp" }
tokio = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = "1"
flume = "0"
async-trait = "0.1"
socket2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windivert = { version = "=0.7.0-beta.4", features = ["vendored"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
