[package]
name = "conwu-raw"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
description = "ConWU optional Mimic and TCPRAW datagram carriers"

[dependencies]
fake-tcp = { path = "../fake-tcp" }
tokio = { workspace = true }
serde_json = "1"
socket2 = "0.6"
rand = "0.9"
flume = "0"
async-trait = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
windivert = { version = "=0.7.0-beta.4", features = ["vendored"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
