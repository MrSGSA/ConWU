function handleRequest(id,approve){const r=model.requests.find(r=>r.id===id);if(!r)return;const n=model.networks.find(n=>n.id===r.network);model.requests=model.requests.filter(r=>r.id!==id);if(approve&&n){n.online=true;n.rtt=19.6;n.seconds=0;n.entry='入站连接';logs.push(['20:04:18','success',r.device+' 已重新加入“'+n.name+'”，保留原虚拟 IP'])}render();notify(approve?'已同意 '+r.device+' 加入网络':'已拒绝 '+r.device+' 的申请')}
function updateExitConfirmation(id){const n=model.networks.find(n=>n.id===id);if(!n)return;const host=n.role==='host';$('confirm-title').textContent=host?'删除本机创建的网络？':'退出当前网络？';$('confirm-description').textContent=host?'这将删除“'+n.name+'”并结束此网络的连接，其他网络和本机设置保留。':'本机将退出“'+n.name+'”，其他网络和设置保留。';$('confirm-action').textContent=host?'确认删除网络':'确认退出网络'}
function exitNetwork(id=''){if(!model.networks.length){notify('当前没有可退出的网络');return}const n=model.networks.find(n=>n.id===id)||model.networks[0];ask(n.role==='host'?'删除本机创建的网络？':'退出当前网络？',n.role==='host'?'这将结束此网络的连接，其他网络和本机设置保留。':'本机将退出选中的网络，其他网络和设置保留。','确认退出',()=>{const target=$('exit-network-select')?.value||n.id,removed=model.networks.find(item=>item.id===target);model.networks=model.networks.filter(n=>n.id!==target);model.requests=model.requests.filter(r=>r.network!==target);if(createdId===target)createdId='';render();notify(removed?.role==='host'?'已删除网络，其他网络与设置保留':'已退出网络，其他网络与设置保留')},`<label class="field"><span>选择网络</span><select id="exit-network-select">${model.networks.map(item=>`<option value="${item.id}" ${item.id===n.id?'selected':''}>${esc(item.name)} · 本机为${item.role==='host'?'主机':'从机'}</option>`).join('')}</select></label>`);updateExitConfirmation(n.id)}
async function copyCode(){let copied=false;try{await navigator.clipboard.writeText('742853');copied=true}catch{const t=document.createElement('textarea');t.value='742853';document.body.append(t);t.select();copied=document.execCommand('copy');t.remove()}notify(copied?'配对码已复制':'请手动选择配对码复制',!copied)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.page){navigate(b.dataset.page);return}if(b.dataset.range){chartRange=Number(b.dataset.range);render();return}if(b.dataset.joinTab){joinTab=b.dataset.joinTab;joinPhase='idle';joinGeneration++;clearTimeout(joinTimer);render();return}if(b.dataset.editorSection){editorSection=b.dataset.editorSection;renderEditor();return}if(b.dataset.close){$(b.dataset.close).close();return}switch(b.dataset.action){
 case 'theme':{const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'dark';$('theme-button').innerHTML=icon(light?'moon':'sun');$('theme-button').setAttribute('aria-label',light?'切换深色外观':'切换浅色外观');break}
 case 'open-network-settings':openNetworkSettings(b.dataset.network||'');break;
 case 'close-network-settings':closeEditor();break;
 case 'revert-network-settings':editor.draft=clone(editor.base);renderEditor();break;
 case 'save-network-settings':saveNetworkSettings();break;
 case 'add-entry':if(editor.draft.entries.length<8){editor.draft.entries.push('');renderEditor()}else notify('最多添加 8 个入口',true);break;
 case 'remove-entry':editor.draft.entries.splice(Number(b.dataset.entryIndex),1);renderEditor();break;
 case 'test-entry':$('entry-test-state').textContent='正在解析…';setTimeout(()=>{if($('entry-test-state'))$('entry-test-state').textContent='已取得 1 个候选，仍需连接验证'},600);break;
 case 'create-network':createNetwork();break;
 case 'new-create':createdId='';createName='';render();break;
 case 'copy-code':void copyCode();break;
 case 'cancel-join':joinGeneration++;clearTimeout(joinTimer);joinPhase='idle';render();notify('已取消本次申请');break;
 case 'another-join':joinPhase='idle';joinedId='';joinCode='';joinInvitation='';render();break;
 case 'open-lookup':openLookup();break;
 case 'save-lookup':{const kind=$('lookup-kind').value,address=$('lookup-address').value.trim();if(!address){$('lookup-error').textContent='请填写主机入口或协调地址。';return}if(kind==='coordinator'){try{if(new URL(address).protocol!=='https:')throw Error()}catch{$('lookup-error').textContent='请填写 HTTPS 协调地址。';return}}lookup={kind,address};$('lookup-dialog').close();render();notify('查找方式已保存');break}
 case 'approve-request':handleRequest(b.dataset.request,true);break;
 case 'reject-request':handleRequest(b.dataset.request,false);break;
 case 'save-device':if(!deviceDraft.name.trim()){notify('请输入设备名称',true);$('device-name').focus();return}Object.assign(model,deviceDraft,{name:deviceDraft.name.trim()});deviceDraft=null;render();notify('本机设置已保存');break;
 case 'revert-device':deviceDraft=null;render();notify('已恢复保存的本机设置');break;
 case 'default-device':deviceDraft={name:'Akane-Laptop',startup:true,level:'info',terminal:'auto'};render();notify('已填入默认设置，保存后生效');break;
 case 'save-coordinator':{const d=coordinatorDraft;if(d.discover){try{if(new URL(d.server).protocol!=='https:')throw Error()}catch{notify('请填写有效的 HTTPS 协调地址',true);return}}if(!Number.isInteger(d.coordinatorPort)||d.coordinatorPort<1024||d.coordinatorPort>65535){notify('监听端口应为 1024～65535',true);return}Object.assign(model,d);if(lookup.kind==='coordinator')lookup.address=d.discover?d.server:'';coordinatorDraft=null;render();notify('协调设置已保存');break}
 case 'revert-coordinator':coordinatorDraft=null;render();break;
 case 'test-server':$('server-test-state').innerHTML='<span class="dot amber"></span>正在检查…';setTimeout(()=>{if($('server-test-state'))$('server-test-state').innerHTML='<span class="dot good"></span>连接正常'},650);break;
 case 'pause-logs':logsPaused=!logsPaused;render();break;
 case 'export-logs':{const blob=new Blob([logs.map(l=>l[0]+' ['+l[1].toUpperCase()+'] '+l[2]).join('\n')],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ConWU-预览日志.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);break}
 case 'exit-network':exitNetwork();break;
 case 'delete-owned':exitNetwork(b.dataset.network);break;
 }});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='new-network-name')createName=el.value;if(el.dataset.entry!==undefined&&editor){editor.draft.entries[Number(el.dataset.entry)]=el.value;editorDirty()}const {scope,key}=el.dataset;if(!scope||!key)return;if(el.type==='radio'&&!el.checked)return;const value=el.type==='checkbox'?el.checked:el.type==='number'?Number(el.value):key==='automaticIp'?el.value==='true':el.value;if(scope==='network'&&editor){editor.draft[key]=value;if(['mode','automaticIp','protocol'].includes(key))renderEditor();else editorDirty()}if(scope==='device'&&deviceDraft){deviceDraft[key]=value;deviceDirty()}if(scope==='coordinator'&&coordinatorDraft){coordinatorDraft[key]=value;coordinatorDirty()}});
document.addEventListener('change',e=>{if(e.target.id==='exit-network-select')updateExitConfirmation(e.target.value);if(e.target.id==='lookup-kind'){$('lookup-address-label').textContent=e.target.value==='entry'?'目标主机的可达入口':'HTTPS 协调地址';$('lookup-address').value=e.target.value===lookup.kind?lookup.address:e.target.value==='coordinator'?model.server:'';$('lookup-address').placeholder=e.target.value==='entry'?'IP:端口 或 HTTPS/TXT 订阅':'https://coord.example.com/'}if(e.target.id==='log-filter')renderLogLines()});
document.addEventListener('input',e=>{if(e.target.id==='log-search')renderLogLines()});
$('confirm-action').onclick=()=>{const callback=confirmCallback;confirmCallback=null;callback?.();$('confirm-dialog').close()};
$('network-dialog').addEventListener('cancel',e=>{e.preventDefault();closeEditor()});
setInterval(()=>{for(const n of model.networks)if(n.online)n.seconds++;if(page==='overview'){for(const span of document.querySelectorAll('[data-duration]')){const n=model.networks.find(n=>n.id===span.dataset.duration);if(n)span.textContent=connectedTime(n.seconds)}chartTick++;if(chartTick%2===0){const i=chartTick*.25;downSamples.shift();downSamples.push(Math.max(.2,12.1+1.5*Math.sin(i)+.55*Math.cos(i*2.6)));upSamples.shift();upSamples.push(.13+.035*Math.sin(i*.8));drawChart()}}},1000);
render();
</script>
</body></html>
